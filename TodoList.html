<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List</title>
    <!-- Bootstrap for styling -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-1BmE4kWBq78iYhFldvKuhfTAU6auU8tT94WrHftjDbrCEXSU1oBoqyl2QvZ6jIW3" crossorigin="anonymous">
    <style>
        .header-title {
            font-size: 2rem; /* Larger font size */
            text-align: center; /* Center the text */
        }
    </style>
</head>
<body>
    <!-- Bootstrap header -->
    <div class="p-3 mb-2 bg-dark text-white header-title">To-Do List</div>

    <!-- Main container for the to-do list -->
    <div class="container mt-5">
        <!-- for adding new tasks-->
        <div class="input-group mb-3">
            <input type="text" id="TInput" class="form-control" placeholder="Add a task">
            <button class="btn btn-primary" id="Addbtn">Add</button>
        </div>
        <!-- List display -->
        <ul class="list-group" id="taskList"></ul>
    </div>

    <script>
        
        document.addEventListener('DOMContentLoaded', () => {

            const taskInput = document.getElementById('TInput');
            const addTaskButton = document.getElementById('Addbtn');
            const taskList = document.getElementById('taskList');
            
            // Load tasks from localStorage or initialize an empty array
            const tasks = JSON.parse(localStorage.getItem('tasks')) || [];

            // Function to save tasks to localStorage
            function saveTasks() {
                localStorage.setItem('tasks', JSON.stringify(tasks));
            }

            // Function to render tasks in the list
            function renderTasks() {
                taskList.innerHTML = ''; // Clear the current list
                tasks.forEach((task, index) => {
                    // Create a new list item for each task
                    const listItem = document.createElement('li');
                    listItem.className = `list-group-item d-flex justify-content-between align-items-center ${task.done ? 'list-group-item-success' : ''}`;
                    listItem.innerHTML = `
                        <span>${task.text}</span>
                        <div>
                            <button class="btn btn-sm btn-success doneBtn">DONE</button>
                            <button class="btn btn-sm btn-danger removeBtn">DELETE</button>
                        </div>
                    `;
                    
                    // Event listener for done button
                    listItem.querySelector('.doneBtn').addEventListener('click', () => {
                        task.done = !task.done; 
                        saveTasks(); 
                        renderTasks();
                    });
                    
                    // Event listener for delete button
                    listItem.querySelector('.removeBtn').addEventListener('click', () => {
                        tasks.splice(index, 1); 
                        saveTasks(); 
                        renderTasks();
                    });
                    
                    taskList.appendChild(listItem); 
                });
            }

            // Event listener for add button
            addTaskButton.addEventListener('click', () => {
                const taskText = taskInput.value.trim(); 
                if (taskText) {
                    tasks.push({ text: taskText, done: false });
                    renderTasks(); 
                    taskInput.value = ''; 
                }
            });

            renderTasks(); 
        });
    </script>
</body>
</html>
